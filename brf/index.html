<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijzondere Rechtspraak Friesland (1945-1948) - Database</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 border-b border-gray-200 pb-6">
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Bijzondere Rechtspraak Friesland (1945-1948)</h1>
            <p class="text-gray-500 mt-2">Geautomatiseerde extractie van verdachtencasus uit de Tribunalen en Bijzondere Gerechtshoven via Delpher.</p>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 mb-6 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Zoeken op meerdere woorden (bijv: vliegveld landwacht)</label>
                <input type="text" id="searchBar" placeholder="Typ trefwoorden..." 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div class="w-full md:w-48">
                <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Filter op Krant</label>
                <select id="krantFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                    <option value="">Alle kranten</option>
                </select>
            </div>
            <div class="w-full md:w-48 flex items-end">
                <div class="text-xs text-gray-500 pb-2 font-medium">
                    Resultaten gevonden: <span id="counter" class="font-bold text-gray-900">0</span>
                </div>
            </div>
        </div>

        <main id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            <div class="col-span-full text-center py-12 text-gray-400">Data aan het laden...</div>
        </main>
    </div>

    <script>
        let alleVerdachten = [];

        // Debounce helper: voorkomt dat de browser herstelt bij elke losse letter die je typt
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        // Helper-functie om krantennamen netjes te kapitaliseren
        function naarTitleCase(str) {
            if (!str) return '';
            return str.toLowerCase().split(' ').map(woord => {
                return woord.charAt(0).toUpperCase() + woord.slice(1);
            }).join(' ');
        }

        // 1. Data ophalen van de lokale webserver
        async function laadData() {
            try {
                const response = await fetch('verdachten_data.json');
                if (!response.ok) throw new Error('Kon JSON-bestand niet laden');
                alleVerdachten = await response.json();
                
                vulKrantenFilter();
                renderCards(alleVerdachten);
            } catch (error) {
                document.getElementById('cardsGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500 font-medium">
                        Fout bij laden data: ${error.message}<br>
                        <span class="text-xs text-gray-400">Zorg ervoor dat de lokale webserver draait via de terminal.</span>
                    </div>`;
            }
        }

        // 2. Krantenfilter dynamisch vullen en ontdubbelen
        function vulKrantenFilter() {
            const select = document.getElementById('krantFilter');
            const genormaliseerdeKranten = alleVerdachten.map(v => naarTitleCase(v.Krant));
            const uniekeKranten = [...new Set(genormaliseerdeKranten)].filter(Boolean);
            
            uniekeKranten.sort().forEach(krant => {
                const opt = document.createElement('option');
                opt.value = krant.toLowerCase();
                opt.textContent = krant;
                select.appendChild(opt);
            });
        }

        // 3. Razendsnelle render-functie op basis van één grote string-buffer
        function renderCards(data) {
            const grid = document.getElementById('cardsGrid');
            const counter = document.getElementById('counter');
            
            counter.textContent = data.length;

            if (data.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Geen verdachten gevonden die voldoen aan de criteria.</div>';
                return;
            }

            // Verzamel alle HTML-kaarten razendsnel in het geheugen
            const htmlBuffer = data.map(v => `
                <div class="bg-white rounded-xl shadow-xs border border-gray-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow duration-200">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <h2 class="text-lg font-bold text-gray-900 leading-tight">${v.Verdachte_Naam}</h2>
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-600 px-2 py-0.5 rounded-sm shrink-0">
                                ${v.Woonplaats !== '-' ? v.Woonplaats : 'Plaats onbekend'}
                            </span>
                        </div>
                        
                        <div class="text-xs text-gray-400 mb-4 font-medium">
                            ${naarTitleCase(v.Krant)} &bull; ${v.Datum}
                        </div>

                        <div class="space-y-3 text-sm">
                            ${v.Leeftijd && v.Leeftijd !== '-' && v.Leeftijd !== 'Niet vermeld' ? `<div><span class="font-semibold text-gray-500 text-xs uppercase block">Leeftijd / Geboorte</span><p class="text-gray-800">${v.Leeftijd}</p></div>` : ''}
                            
                            <div>
                                <span class="font-semibold text-gray-500 text-xs uppercase block">Tribunaal / Gerechtshof</span>
                                <p class="text-gray-800 font-medium">${v.Tribunaal !== '-' ? v.Tribunaal : 'Niet vermeld'}</p>
                            </div>
                            
                            <div>
                                <span class="font-semibold text-gray-500 text-xs uppercase block">Aanklacht</span>
                                <p class="text-gray-800 line-clamp-3 hover:line-clamp-none transition-all duration-300 cursor-pointer">${v.Aanklacht}</p>
                            </div>
                            
                            <div>
                                <span class="font-semibold text-gray-500 text-xs uppercase block">Straf-eis</span>
                                <p class="text-gray-700">${v.Straf_Eis}</p>
                            </div>
                            
                            <div>
                                <span class="font-semibold text-gray-500 text-xs uppercase block">Uitspraak</span>
                                <p class="text-gray-900 font-medium">${v.Uitspraak}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-5 pt-3 border-t border-gray-100 flex justify-end">
                        <a href="${v.URL}" target="_blank" class="text-xs font-semibold text-blue-600 hover:text-blue-800 inline-flex items-center gap-1">
                            Bekijk origineel op Delpher &rarr;
                        </a>
                    </div>
                </div>
            `).join('');

            // Schiet de hele buffer in één keer de DOM in
            grid.innerHTML = htmlBuffer;
        }

        // 4. Geoptimaliseerde filter functionaliteit (Multi-woord AND-search)
        function filterData() {
            const zoekTerm = document.getElementById('searchBar').value.toLowerCase().trim();
            const geselecteerdeKrant = document.getElementById('krantFilter').value;

            // Splits de invoer op basis van spaties en filter eventuele extra lege spaties eruit
            const trefwoorden = zoekTerm.split(/\s+/).filter(Boolean);

            const gefilterd = alleVerdachten.filter(v => {
                // Bouw één doorzoekbare tekststreng van alle relevante datavelden van deze persoon
                const recordTekst = [
                    v.Verdachte_Naam,
                    v.Aanklacht,
                    v.Woonplaats,
                    v.Tribunaal
                ].join(' ').toLowerCase();

                // Controleer of ELK afzonderlijk trefwoord aanwezig is in de tekst van dit record
                const matchZoek = trefwoorden.every(woord => recordTekst.includes(woord));
                
                const krantNaamLaag = v.Krant ? v.Krant.toLowerCase() : "";
                const matchKrant = geselecteerdeKrant === "" || krantNaamLaag === geselecteerdeKrant;

                return matchZoek && matchKrant;
            });

            renderCards(gefilterd);
        }

        // Event listeners koppelen (Met de 250ms ademruimte-rem)
        document.getElementById('searchBar').addEventListener('input', debounce(filterData, 250));
        document.getElementById('krantFilter').addEventListener('change', filterData);

        // Start de applicatie
        laadData();
    </script>
</body>
</html>
